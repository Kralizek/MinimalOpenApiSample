name: Build

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  build:
    name: Restore and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MinimalOpenApiSample.slnx

      - name: Build
        run: dotnet build MinimalOpenApiSample.slnx --configuration Release --no-restore
